# Supabase Configuration for The Tour Vision
project_id = "the-tour-vision"

[api]
port = 54321
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/account"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"
